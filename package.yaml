name:                fy
version:             0.1.0.0
github:              "githubuser/fy"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/fy#readme>

dependencies:
- base >= 4.7 && < 5
- containers >= 0.6 && < 1
- mtl >= 2 && <3
- text >= 2 && <3
- megaparsec >= 9 && <10
- parser-combinators >= 1.3 && < 2
- microlens-platform >= 0.4.3 && < 1
- process
- unordered-containers
- hashable
- prettyprinter
- prettyprinter-ansi-terminal


ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Werror=incomplete-patterns

default-extensions:
- OverloadedStrings
- FlexibleInstances
- DeriveFunctor
- DeriveFoldable
- DeriveAnyClass
- DeriveGeneric
- StandaloneDeriving
- FunctionalDependencies
- MultiParamTypeClasses

library:
  source-dirs: src

executables:
  fy-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fy

tests:
  fy-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fy
